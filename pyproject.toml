[project]
name = "internship-autopilot"
version = "0.1.0"
description = "Local-first internship pipeline: source, score, tailor, autofill (never auto-submit)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pypdf>=5.0",
]

[project.scripts]
iap = "iap.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
