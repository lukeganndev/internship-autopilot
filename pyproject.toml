[project]
name = "internship-autopilot"
version = "0.1.0"
description = "Local-first internship pipeline: source, score, tailor, autofill (never auto-submit)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pypdf>=5.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "playwright>=1.48",
    "keyring>=25",
    "google-auth-oauthlib>=1.2",
    "msal>=1.30",
    "windows-toasts>=1.3; sys_platform == 'win32'",
]

[project.scripts]
iap = "iap.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
